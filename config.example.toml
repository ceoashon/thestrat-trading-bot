# Copy this file to config.toml and fill it in. config.toml is git-ignored, so your passwords never get committed.
# Passwords can also come from environment variables instead: TRADOVATE_USERNAME, TRADOVATE_PASSWORD, TRADOVATE_CID,
# TRADOVATE_SEC, BOT_SECRET.

[tradovate]
env = "demo"              # "demo" or "live"
username = ""             # your Tradovate login
password = ""
cid = 0                   # from the API key you create in Tradovate (Application Settings > API Access)
sec = ""                  # the secret of that API key
app_id = "StratBot"
app_version = "1.0"
account_name = ""         # blank = the first account on the login (for example DEMO123456)

[instrument]
symbol = "MNQZ6"          # the Tradovate contract. Change the month code at each quarterly roll (Z6 = Dec 2026, H7 = Mar 2027)
tv_tickers = ["MNQ1!", "NQ1!"]   # the TradingView charts allowed to trade it (syminfo.ticker)
timeframe = "5"           # the chart timeframe the alert runs on
tick_size = 0.25
point_value = 2.0         # dollars per point: MNQ 2, NQ 20, MES 5, ES 50
big_symbol = ""           # the full-size contract, for example NQZ6. When risk_pct sizes a trade at big_from contracts or more, it trades this instead, for lower fees. Blank = off. Change its month code at each roll too
big_ratio = 10            # how many of symbol equal one big_symbol: 10 MNQ = 1 NQ. Always rounded down, so the risk never goes over risk_pct
big_from = 20             # the contract count where it switches to big_symbol

[orders]
qty = 1                   # contracts per trade. Not used when risk_pct is on
entry_offset_ticks = 1    # buy stop = setup candle high + 1 tick, sell stop = setup low - 1 tick (the first trade through)
stop_buffer_ticks = 1     # stop and every trail step = 1 tick beyond the candle's low (long) or high (short)
entry_type = "Stop"       # "Stop" fills at market on the break. "StopLimit" caps slippage at stop_limit_ticks but can miss fast breaks
stop_limit_ticks = 4
late_entry_ticks = 10     # the market passed the entry before the order arrived: try once to enter, at most this many ticks past it. 0 = skip the trade

[risk]
direction = "both"        # "both", "long" or "short"
both_sides = true         # an inside bar can arm a long and a short at once (like the indicator). false = only the better ranked one
risk_pct = 0.0            # contracts are sized so entry-to-stop risks this percent of the account balance, rounded down. 0 = use qty
max_qty = 100             # the most contracts risk_pct may size a trade to. A very tight stop then risks less than risk_pct. Tradovate's demo limit is 100
max_trades_per_day = 3    # 0 = no limit
max_daily_loss = 300.0    # dollars of realized loss that stop new entries for the day. 0 = off
max_stop_ticks = 0        # skip setups with a wider stop (entry to stop). 0 = off
min_stop_ticks = 0
setups = [1, 2, 3]        # the setups the bot may trade, by number. [] = every setup the indicator sends. 1 Failed 3-2-2, 2 Failed 1-2-2, 3 Failed 2-2. Outside bars: 11 1-3 Nirvana, 12 3-2 Continuation, 14 3-2 Reversal, 16 1-3-2 Reversal (turn them on in the indicator too)
flatten_unknown_positions = true   # flatten a position on this contract the bot did not open. Do not trade it by hand while the bot runs

[session]
timezone = "America/New_York"
start = "09:30"           # new entries only while the setup candle closes inside this window
end = "11:30"
flatten_at = "15:55"      # cancel everything and close the position. flatten_at = "" never flattens
day_reset = "18:00"       # the futures day starts here (daily trade count and daily loss reset)

[server]
host = "127.0.0.1"        # cloudflared forwards to this
port = 8080
secret = "change-me"      # the same text as "Auto-Trader: Secret" in the indicator settings
max_alert_age_s = 25      # an alert that arrives later than this after the candle closed does not arm (late_entry_ticks limits the chasing)
dry_run = true            # true = log the orders only. Set false to send them to Tradovate
state_file = "bot_state.json"
log_file = "bot.log"

[notify]
discord_webhook = ""      # Discord: channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL
heartbeat_url = ""        # optional: a healthchecks.io ping URL. It alerts you if the bot stops pinging (bot or server down)
armed = true              # message when a setup is armed (the stop entry is placed)
cancels = false           # message when an entry is canceled (no break, or the other side broke first). Busy, off by default
trail = true              # message at every stop move
# Always sent: bot start, fills, closed trades with P&L, flatten time, skipped setups (limits, late alerts), errors.

[journal]                 # optional: logs every finished trade to a Strat Trading Journal journal. Blank token = off
url = ""                  # the journal's Supabase project address
key = ""                  # the Supabase publishable key, the same public one the journal page uses
token = ""                # the bot's own secret. It can only add trades to one journal (deploy/journal_bot_access.sql)
spool = "journal_queue.jsonl"   # trades wait here until the journal has them
